<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Schnell AI Image Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="12" fill="url(#gradient)"/>
                    <path d="M12 20C12 15.5817 15.5817 12 20 12C24.4183 12 28 15.5817 28 20C28 24.4183 24.4183 28 20 28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="20" cy="20" r="3" fill="white"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Flux Schnell</h1>
            </div>
            <p class="subtitle">AI Image Generator</p>
        </header>

        <main>
            <div class="generator-card">
                <div class="input-section">
                    <label for="prompt">Describe your image</label>
                    <textarea 
                        id="prompt" 
                        placeholder="A futuristic city at sunset with flying cars and neon lights..."
                        rows="3"
                    ></textarea>
                    
                    <div class="options">
                        <div class="option-group">
                            <label for="width">Width</label>
                            <select id="width">
                                <option value="512">512px</option>
                                <option value="768">768px</option>
                                <option value="1024" selected>1024px</option>
                                <option value="1280">1280px</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="height">Height</label>
                            <select id="height">
                                <option value="512">512px</option>
                                <option value="768" selected>768px</option>
                                <option value="1024">1024px</option>
                                <option value="1280">1280px</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label for="seed">Seed (optional)</label>
                            <input type="number" id="seed" placeholder="Random">
                        </div>
                    </div>

                    <button id="generate-btn" class="generate-btn">
                        <span class="btn-text">Generate Image</span>
                        <span class="btn-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L12 6M12 18L12 22M2 12L6 12M18 12L22 12"/>
                                <circle cx="12" cy="12" r="4"/>
                            </svg>
                        </span>
                    </button>
                </div>

                <div class="output-section">
                    <div class="image-container" id="image-container">
                        <div class="placeholder">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <path d="M21 15L16 10L5 21"/>
                            </svg>
                            <p>Your generated image will appear here</p>
                        </div>
                        <div class="loading" id="loading">
                            <div class="spinner"></div>
                            <p>Creating your masterpiece...</p>
                        </div>
                        <img id="generated-image" alt="Generated image" style="display: none;">
                    </div>
                    
                    <div class="image-actions" id="image-actions" style="display: none;">
                        <button class="action-btn download-btn" id="download-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V15"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            Download
                        </button>
                        <button class="action-btn new-btn" id="new-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"/>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                            New Image
                        </button>
                    </div>
                </div>
            </div>

            <div class="examples">
                <h3>Try these prompts:</h3>
                <div class="example-chips">
                    <button class="chip" data-prompt="A serene Japanese garden with cherry blossoms and a koi pond, soft morning light">Japanese Garden</button>
                    <button class="chip" data-prompt="Cyberpunk street market at night, neon signs, rain reflections, futuristic">Cyberpunk Market</button>
                    <button class="chip" data-prompt="Majestic mountain landscape with northern lights, stars, ethereal glow">Northern Lights</button>
                    <button class="chip" data-prompt="Cozy coffee shop interior, warm lighting, books, plants, vintage aesthetic">Cozy Cafe</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by <strong>Flux Schnell</strong> via Pollination AI</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
